# Railway: build bằng Dockerfile, CMD lắng nghe ${PORT} do Railway cấp.
# Biến môi trường (AGENT_API_KEY, REDIS_URL, ...) đặt trên dashboard / `railway variables`.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
